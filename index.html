<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tracking NG & Parameter Mesin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans text-slate-800">

    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        
        <!-- Tab Navigation -->
        <div class="flex border-b mb-6">
            <button onclick="switchTab('operator')" id="tabOperator" class="flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600">Borang Operator</button>
            <button onclick="switchTab('admin')" id="tabAdmin" class="flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent">Admin Panel</button>
        </div>

        <!-- Status Alert -->
        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

        <!-- ================= SECTION 1: OPERATOR INPUT ================= -->
        <div id="sectionOperator">
            <div class="pb-4 mb-4 border-b">
                <h1 class="text-xl font-bold text-slate-900">Rekod NG & Parameter Mesin</h1>
                <p class="text-sm text-slate-500">Pilih projek untuk mula merekod data.</p>
            </div>

            <form id="ngForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Projek / Mesin <span class="text-red-500">*</span></label>
                    <select id="projectSelect" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Memuatkan senarai projek...</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Tarikh</label>
                        <input type="date" id="recordedDate" required class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Masa</label>
                        <input type="time" id="recordedTime" step="1" required class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Nama / ID Operator <span class="text-red-500">*</span></label>
                    <input type="text" id="operatorName" required placeholder="Cth: Ali / OP-102" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Mod NG (Jenis Kecacatan) <span class="text-red-500">*</span></label>
                    <select id="ngModeSelect" required disabled class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-100 disabled:cursor-not-allowed">
                        <option value="">-- Pilih Projek Dahulu --</option>
                    </select>
                </div>

                <!-- Container Parameter Dinamik (Nombor Sahaja) -->
                <div id="dynamicParamsContainer" class="space-y-3 pt-2 border-t border-slate-100 hidden">
                    <p class="text-xs font-bold uppercase tracking-wider text-blue-600">Parameter Mesin (Nombor Sahaja)</p>
                    <div id="dynamicFields" class="space-y-3"></div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Catatan Tambahan (Opsyen)</label>
                    <textarea id="remarks" rows="2" placeholder="Pemerhatian..." class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition duration-150">
                    Hantar Rekod NG
                </button>
            </form>
        </div>

        <!-- ================= SECTION 2: ADMIN PANEL ================= -->
        <div id="sectionAdmin" class="hidden">
            <div class="pb-4 mb-4 border-b">
                <h1 class="text-xl font-bold text-slate-900">Daftar Projek / Mesin Baru</h1>
                <p class="text-sm text-slate-500">Tetapkan tajuk projek, mod NG, dan parameter nombor.</p>
            </div>

            <!-- Login Admin Ringkas -->
            <div id="adminLoginBox" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Kata Laluan Admin</label>
                    <input type="password" id="adminPassword" placeholder="Masukkan password admin" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="button" onclick="verifyAdmin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-lg">
                    Log Masuk Admin
                </button>
            </div>

            <!-- Borang Admin (Selepas Login) -->
            <form id="adminForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-semibold mb-1">Tajuk Projek / Mesin <span class="text-red-500">*</span></label>
                    <input type="text" id="adminProjectTitle" required placeholder="Cth: Solder Line 1" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Mod NG (Guna tanda koma ,) <span class="text-red-500">*</span></label>
                    <input type="text" id="adminNgModes" required placeholder="Cth: solder ball, solder not rise up, solder overflow" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    <p class="text-xs text-slate-400 mt-1">Pisahkan setiap mod NG menggunakan tanda koma.</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Label Parameter 1</label>
                        <input type="text" id="adminParam1" value="Motion 1" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50" readonly>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Label Parameter 2</label>
                        <input type="text" id="adminParam2" value="Motion 2" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50" readonly>
                    </div>
                </div>

                <button type="submit" id="saveProjectBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg shadow transition duration-150">
                    Simpan Projek Baru ke Database
                </button>
            </form>
        </div>

    </div>

    <script>
        // 1. KONFIGURASI SUPABASE
        const SUPABASE_URL = 'https://wihhqdofojauoujjrscp.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpaGhxZG9mb2phdW91ampyc2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2Njc2NjMsImV4cCI6MjExMDI0MzY2M30.6HwO-5MOsEALyArLdW50n50lIk0FcNRAXYT33i5gnzY'; // Ganti dengan publishable key anda
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let projectsData = [];

        // Tukar Tab (Operator / Admin)
        function switchTab(tab) {
    const opSec = document.getElementById('sectionOperator');
    const adSec = document.getElementById('sectionAdmin');
    const tabOp = document.getElementById('tabOperator');
    const tabAd = document.getElementById('tabAdmin');

    if (tab === 'operator') {
        opSec.classList.remove('hidden');
        adSec.classList.add('hidden');
        tabOp.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600";
        tabAd.className = "flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent";
        fetchProjects(); // <--- Pastikan baris ini ada supaya senarai ditarik semula setiap kali buka tab operator
    } else {
        opSec.classList.add('hidden');
        adSec.classList.remove('hidden');
        tabAd.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600";
        tabOp.className = "flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent";
    }
}

        // Semak Password Admin (Contoh password mudah: "admin123")
        function verifyAdmin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === 'admin123') {
                document.getElementById('adminLoginBox').classList.add('hidden');
                document.getElementById('adminForm').classList.remove('hidden');
                showAlert('Log masuk admin berjaya!', 'success');
            } else {
                showAlert('Kata laluan admin salah!', 'error');
            }
        }

        // Tarikh & Masa Semasa
        function setCurrentDateTime() {
            const now = new Date();
            const localDate = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            const localTime = now.toTimeString().slice(0, 8);
            document.getElementById('recordedDate').value = localDate;
            document.getElementById('recordedTime').value = localTime;
        }

        // Tarik Projek
        async function fetchProjects() {
            const projectSelect = document.getElementById('projectSelect');
            const { data, error } = await supabaseClient
                .from('ng_projects')
                .select('*')
                .eq('is_active', true)
                .order('created_at', { ascending: false });

            if (error) {
                projectSelect.innerHTML = '<option value="">Ralat sambungan database</option>';
                return;
            }

            projectsData = data;
            projectSelect.innerHTML = '<option value="">-- Sila Pilih Projek / Mesin --</option>';
            data.forEach(proj => {
                const option = document.createElement('option');
                option.value = proj.id;
                option.textContent = proj.project_title;
                projectSelect.appendChild(option);
            });
        }

        // Papar Borang Dinamik Mengikut Projek (Parameter Nombor Sahaja)
        document.getElementById('projectSelect').addEventListener('change', function() {
            const selectedId = this.value;
            const ngModeSelect = document.getElementById('ngModeSelect');
            const paramsContainer = document.getElementById('dynamicParamsContainer');
            const dynamicFields = document.getElementById('dynamicFields');

            dynamicFields.innerHTML = '';
            if (!selectedId) {
                ngModeSelect.innerHTML = '<option value="">-- Pilih Projek Dahulu --</option>';
                ngModeSelect.disabled = true;
                paramsContainer.classList.add('hidden');
                return;
            }

            const project = projectsData.find(p => p.id === selectedId);

            ngModeSelect.disabled = false;
            ngModeSelect.innerHTML = '<option value="">-- Pilih Jenis NG --</option>';
            (project.ng_modes || []).forEach(mode => {
                const opt = document.createElement('option');
                opt.value = mode;
                opt.textContent = mode;
                ngModeSelect.appendChild(opt);
            });

            const labels = project.parameter_labels || [];
            if (labels.length > 0) {
                paramsContainer.classList.remove('hidden');
                labels.forEach(label => {
                    const wrapper = document.createElement('div');
                    wrapper.innerHTML = `
                        <label class="block text-sm font-medium text-slate-700 mb-1">${label} (Nombor Sahaja) <span class="text-red-500">*</span></label>
                        <input type="number" step="any" data-param-label="${label}" required 
                               placeholder="Masukkan nilai nombor untuk ${label}" 
                               class="dynamic-param-input w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    `;
                    dynamicFields.appendChild(wrapper);
                });
            } else {
                paramsContainer.classList.add('hidden');
            }
        });

        // Simpan Projek Baru dari Admin Panel
        document.getElementById('adminForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const title = document.getElementById('adminProjectTitle').value.trim();
            const modesRaw = document.getElementById('adminNgModes').value;
            const ngModes = modesRaw.split(',').map(m => m.trim()).filter(m => m.length > 0);

            // Tetapan tetap untuk Parameter 1 (Motion 1) dan Parameter 2 (Motion 2)
            const parameterLabels = ["Motion 1", "Motion 2"];

            const { error } = await supabaseClient
                .from('ng_projects')
                .insert([{
                    project_title: title,
                    parameter_labels: parameterLabels,
                    ng_modes: ngModes,
                    is_active: true
                }]);

            if (error) {
                showAlert('Gagal simpan projek: ' + error.message, 'error');
            } else {
                showAlert('Projek baru berjaya didaftarkan!', 'success');
                document.getElementById('adminProjectTitle').value = '';
                document.getElementById('adminNgModes').value = '';
                switchTab('operator');
            }
        });

        // Hantar Rekod NG oleh Operator
        document.getElementById('ngForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const parameterValues = {};
            document.querySelectorAll('.dynamic-param-input').forEach(input => {
                const label = input.getAttribute('data-param-label');
                parameterValues[label] = input.value.trim();
            });

            const payload = {
                project_id: document.getElementById('projectSelect').value,
                recorded_date: document.getElementById('recordedDate').value,
                recorded_time: document.getElementById('recordedTime').value,
                operator_name: document.getElementById('operatorName').value.trim(),
                ng_mode: document.getElementById('ngModeSelect').value,
                parameter_values: parameterValues,
                remarks: document.getElementById('remarks').value.trim() || null
            };

            const { error } = await supabaseClient.from('ng_records').insert([payload]);

            if (error) {
                showAlert('Ralat simpan data: ' + error.message, 'error');
            } else {
                showAlert('Rekod NG berjaya disimpan!', 'success');
                document.getElementById('ngModeSelect').value = '';
                document.getElementById('remarks').value = '';
                document.querySelectorAll('.dynamic-param-input').forEach(input => input.value = '');
                setCurrentDateTime();
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `mb-4 p-3 rounded-lg text-sm font-medium ${
                type === 'success' ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300'
            }`;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 4000);
        }

        // Mulakan
        setCurrentDateTime();
        fetchProjects();
    </script>
</body>
</html>
