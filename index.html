<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tracking NG & Parameter Mesin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans text-slate-800">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        
        <!-- Tab Navigation -->
        <div class="flex border-b mb-6 overflow-x-auto">
            <button type="button" id="tabOperator" class="flex-1 py-3 px-4 text-center font-bold text-blue-600 border-b-2 border-blue-600 cursor-pointer whitespace-nowrap">Borang Operator</button>
            <button type="button" id="tabDashboard" class="flex-1 py-3 px-4 text-center font-bold text-slate-400 border-b-2 border-transparent cursor-pointer whitespace-nowrap">Dashboard & Graf</button>
            <button type="button" id="tabAdmin" class="flex-1 py-3 px-4 text-center font-bold text-slate-400 border-b-2 border-transparent cursor-pointer whitespace-nowrap">Admin Panel</button>
        </div>

        <!-- Status Alert -->
        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

        <!-- ================= SECTION 1: OPERATOR INPUT ================= -->
        <div id="sectionOperator" class="max-w-xl mx-auto">
            <div class="pb-4 mb-4 border-b">
                <h1 class="text-xl font-bold text-slate-900">Rekod NG & Parameter Mesin</h1>
                <p class="text-sm text-slate-500">Pilih projek untuk mula merekod data.</p>
            </div>

            <form id="ngForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Projek / Mesin <span class="text-red-500">*</span></label>
                    <select id="projectSelect" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Memuatkan senarai projek...</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Tarikh</label>
                        <input type="date" id="recordedDate" required class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Masa</label>
                        <input type="time" id="recordedTime" step="1" required class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Nama / ID Operator <span class="text-red-500">*</span></label>
                    <input type="text" id="operatorName" required placeholder="Cth: Ali / OP-102" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Mod NG (Jenis Kecacatan) <span class="text-red-500">*</span></label>
                    <select id="ngModeSelect" required disabled class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-100 disabled:cursor-not-allowed">
                        <option value="">-- Pilih Projek Dahulu --</option>
                    </select>
                </div>

                <div id="dynamicParamsContainer" class="space-y-3 pt-2 border-t border-slate-100 hidden">
                    <p class="text-xs font-bold uppercase tracking-wider text-blue-600">Parameter Mesin (Nombor Sahaja)</p>
                    <div id="dynamicFields" class="space-y-3"></div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Catatan Tambahan (Opsyen)</label>
                    <textarea id="remarks" rows="2" placeholder="Pemerhatian..." class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition duration-150">
                    Hantar Rekod NG
                </button>
            </form>
        </div>

        <!-- ================= SECTION 2: DASHBOARD & GRAF ================= -->
        <div id="sectionDashboard" class="hidden space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b">
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Analisis Trend & Hubungan Parameter</h1>
                    <p class="text-sm text-slate-500">Pilih projek untuk melihat graf trend masa, korelasi parameter, dan taburan NG.</p>
                </div>
                <div class="flex items-center gap-2">
                    <select id="dashboardProjectSelect" class="border border-slate-300 rounded-lg p-2.5 bg-white font-medium text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">-- Pilih Projek --</option>
                    </select>
                    <button type="button" id="btnRefreshDashboard" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2.5 rounded-lg text-sm font-semibold">
                        Refresh
                    </button>
                    <button type="button" id="btnExportCsv" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2.5 rounded-lg text-sm font-semibold">
                        Export CSV
                    </button>
                </div>
            </div>

            <!-- Ringkasan Kad Statistik -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <p class="text-xs text-slate-500 uppercase font-bold">Jumlah Rekod NG</p>
                    <p id="statTotalNg" class="text-2xl font-bold text-slate-900 mt-1">0</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <p class="text-xs text-slate-500 uppercase font-bold">Mod NG Tertinggi</p>
                    <p id="statTopMode" class="text-lg font-bold text-red-600 mt-1 truncate">-</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <p class="text-xs text-slate-500 uppercase font-bold">Purata Parameter</p>
                    <p id="statAvgParams" class="text-sm font-semibold text-slate-700 mt-1">-</p>
                </div>
            </div>

            <!-- Ruang Carta -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Graf 1: Trend Parameter Mengikut Masa -->
                <div class="bg-white p-4 rounded-lg border border-slate-2
