<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Tracking NG & Parameter Mesin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans text-slate-800">

    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        
        <!-- Tab Navigation -->
        <div class="flex border-b mb-6">
            <button onclick="switchTab('operator')" id="tabOperator" class="flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600">Borang Operator</button>
            <button onclick="switchTab('admin')" id="tabAdmin" class="flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent">Admin Panel</button>
        </div>

        <!-- Status Alert -->
        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

        <!-- ================= SECTION 1: OPERATOR INPUT ================= -->
        <div id="sectionOperator">
            <div class="pb-4 mb-4 border-b">
                <h1 class="text-xl font-bold text-slate-900">Rekod NG & Parameter Mesin</h1>
                <p class="text-sm text-slate-500">Pilih projek untuk mula merekod data.</p>
            </div>

            <form id="ngForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Projek / Mesin <span class="text-red-500">*</span></label>
                    <select id="projectSelect" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">Memuatkan senarai projek...</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Tarikh</label>
                        <input type="date" id="recordedDate" required class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Masa</label>
                        <input type="time" id="recordedTime" step="1" required class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Nama / ID Operator <span class="text-red-500">*</span></label>
                    <input type="text" id="operatorName" required placeholder="Cth: Ali / OP-102" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Mod NG (Jenis Kecacatan) <span class="text-red-500">*</span></label>
                    <select id="ngModeSelect" required disabled class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-100 disabled:cursor-not-allowed">
                        <option value="">-- Pilih Projek Dahulu --</option>
                    </select>
                </div>

                <!-- Container Parameter Dinamik (Nombor Sahaja) -->
                <div id="dynamicParamsContainer" class="space-y-3 pt-2 border-t border-slate-100 hidden">
                    <p class="text-xs font-bold uppercase tracking-wider text-blue-600">Parameter Mesin (Nombor Sahaja)</p>
                    <div id="dynamicFields" class="space-y-3"></div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Catatan Tambahan (Opsyen)</label>
                    <textarea id="remarks" rows="2" placeholder="Pemerhatian..." class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition duration-150">
                    Hantar Rekod NG
                </button>
            </form>
        </div>

        <!-- ================= SECTION 2: ADMIN PANEL ================= -->
        <div id="sectionAdmin" class="hidden">
            <div class="pb-4 mb-4 border-b">
                <h1 class="text-xl font-bold text-slate-900">Daftar Projek / Mesin Baru</h1>
                <p class="text-sm text-slate-500">Tetapkan tajuk projek, mod NG, dan label parameter nombor.</p>
            </div>

            <!-- Login Admin Ringkas -->
            <div id="adminLoginBox" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Kata Laluan Admin</label>
                    <input type="password" id="adminPassword" placeholder="Masukkan password admin" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="button" onclick="verifyAdmin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-lg">
                    Log Masuk Admin
                </button>
            </div>

            <!-- Borang Admin (Selepas Login) -->
            <form id="adminForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-semibold mb-1">Tajuk Projek / Mesin <span class="text-red-500">*</span></label>
                    <input type="text" id="adminProjectTitle" required placeholder="Cth: NG Solder" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Mod NG (Pisahkan dengan koma ,) <span class="text-red-500">*</span></label>
                    <input type="text" id="adminNgModes" required placeholder="Cth: solder ball, solder not rise up, solder overflow" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Label Parameter 1 <span class="text-red-500">*</span></label>
                        <input type="text" id="adminParam1" value="Motion 1" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Label Parameter 2 <span class="text-red-500">*</span></label>
                        <input type="text" id="adminParam2" value="Motion 2" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <button type="submit" id="saveProjectBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg shadow transition duration-150">
                    Simpan Projek Baru ke Database
                </button>
            </form>
        </div>

    </div>
